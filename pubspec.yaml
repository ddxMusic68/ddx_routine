name: ddx_routine
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  path_provider: ^2.1.5
  package_info_plus: 9.0.0
  url_launcher: ^6.3.0
  file_picker: 11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ddxRoutine_icon.png"
  windows:
    generate: true
    image_path: "assets/ddxRoutine_icon.png"